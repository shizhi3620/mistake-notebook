name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math-mistake-notebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: math-mistake-notebook/package-lock.json
      - run: npm ci
      - run: npm run preflight
      - run: docker build --tag math-mistake-notebook:${{ github.sha }} .
