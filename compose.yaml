services:
  app:
    build: .
    environment:
      DATABASE_PATH: /data/learning.db
      PORT: 3000
      WECHAT_APP_ID: ${WECHAT_APP_ID:?set WECHAT_APP_ID in the deployment environment}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?set WECHAT_APP_SECRET in the deployment environment}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PRODUCTION: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - learning_data:/data
    restart: unless-stopped

volumes:
  learning_data:
